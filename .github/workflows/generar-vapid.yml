name: Generar claves VAPID

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Generar claves sin mostrarlas
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save web-push@3.6.7
          node - <<'NODE'
          const fs = require('fs');
          const webpush = require('web-push');
          const keys = webpush.generateVAPIDKeys();
          fs.writeFileSync('vapid-public.txt', keys.publicKey, {mode: 0o600});
          fs.writeFileSync('vapid-private.txt', keys.privateKey, {mode: 0o600});
          console.log('Claves generadas sin imprimir sus valores.');
          NODE
      - name: Guardar claves como artefacto privado
        uses: actions/upload-artifact@v4
        with:
          name: claves-vapid
          path: |
            vapid-public.txt
            vapid-private.txt
          retention-days: 1
  
